<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackerPro - Venue Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 350px; z-index: 1; border-radius: 0.5rem 0.5rem 0 0; }
        body { background-color: #f4f7f6; }
    </style>
</head>
<body class="font-sans antialiased text-gray-800">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-md">
        <!-- Header -->
        <header class="flex justify-between items-center p-4 border-b">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-gray-900">GeoTrackerPro</h1>
            </div>
            <div id="status-badge" class="flex items-center space-x-1 px-3 py-1 bg-gray-100 rounded-full text-sm font-medium text-gray-500">
                <div class="w-2 h-2 rounded-full bg-gray-400"></div>
                <span>Idle</span>
            </div>
        </header>

        <!-- Main Content -->
        <div class="p-4 space-y-4">
            
            <!-- Warning for In-App Browsers -->
            <div id="browser-warning" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-800 p-4 rounded-xl text-sm" dir="rtl">
                ⚠️ <strong>تنبيه:</strong> يرجى فتح الرابط في متصفح خارجي (مثل Chrome أو Safari) ليعمل الـ GPS بشكل صحيح.
            </div>

            <!-- Controls Card -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center space-y-3">
                <h2 class="text-lg font-bold">Device Location</h2>
                <p class="text-sm text-gray-500">Monitor real-time geographical coordinates</p>
                
                <button id="start-btn" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition flex justify-center items-center">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    Start Tracking
                </button>

                <button id="stop-btn" class="hidden w-full bg-red-100 text-red-600 font-semibold py-3 rounded-xl hover:bg-red-200 transition justify-center items-center">
                    Stop Tracking
                </button>

                <!-- Telegram Button -->
                <button id="telegram-btn" disabled class="w-full bg-green-500 text-white font-semibold py-3 rounded-xl hover:bg-green-600 transition flex justify-center items-center disabled:opacity-50 mt-2">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.892-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                    Send to Telegram
                </button>
            </div>

            <!-- Error Message -->
            <div id="error-box" class="hidden bg-red-50 border border-red-100 rounded-xl p-4 relative">
                <button onclick="document.getElementById('error-box').classList.add('hidden')" class="absolute top-2 right-2 text-red-400 hover:text-red-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <div class="flex items-start space-x-3">
                    <svg class="w-6 h-6 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    <div>
                        <h3 class="text-sm font-bold text-red-800">Location Error</h3>
                        <p id="error-msg" class="text-sm text-red-600 mt-1">Error fetching location.</p>
                    </div>
                </div>
            </div>

            <!-- Map Container -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                <div id="map"></div>
                <!-- Address Display Area -->
                <div class="p-3 bg-blue-50 border-b border-gray-100 text-sm text-gray-800 flex items-start" dir="rtl">
                    <svg class="w-5 h-5 text-blue-500 ml-2 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <div>
                        <span class="font-bold block text-blue-900">المكان (العنوان):</span> 
                        <span id="address-val" class="text-gray-600 text-xs">--</span>
                    </div>
                </div>
                <div class="p-3 bg-gray-50 text-xs text-gray-500 flex justify-between">
                    <span id="lat-val">Lat: --</span>
                    <span id="lng-val">Lng: --</span>
                    <span id="acc-val">Acc: --</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- TELEGRAM BOT CREDENTIALS ---
        const BOT_TOKEN = '9259193109:AAHIBYU-BV1t0kdMtRuXJ3LzKQXsFB8xwUw';
        const CHAT_ID = '8443985805';

        let map, marker, watchId;
        let currentLat = null, currentLng = null, currentAcc = null;
        let currentAddress = "جاري تحديد العنوان..."; // Holds the address text
        let currentPlaceName = "موقع المستخدم"; // Holds the short title

        // Variables to avoid fetching address constantly
        let lastFetchedLat = null;
        let lastFetchedLng = null;

        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const telegramBtn = document.getElementById('telegram-btn');
        const errorBox = document.getElementById('error-box');
        const errorMsg = document.getElementById('error-msg');
        const statusBadge = document.getElementById('status-badge');
        const addressVal = document.getElementById('address-val');
        
        // Detect if opened inside an in-app browser like WhatsApp
        const isWhatsApp = navigator.userAgent.includes("wv") || navigator.userAgent.includes("WhatsApp");
        if (isWhatsApp || window.location.href.startsWith("content://")) {
            document.getElementById('browser-warning').classList.remove('hidden');
        }

        function initMap() {
            map = L.map('map').setView([0, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        async function fetchAddress(lat, lng) {
            // Only fetch if location changed significantly (approx 50 meters) to save API calls
            if (lastFetchedLat && Math.abs(lat - lastFetchedLat) < 0.0005 && Math.abs(lng - lastFetchedLng) < 0.0005) {
                return;
            }
            lastFetchedLat = lat;
            lastFetchedLng = lng;
            addressVal.textContent = "جاري تحديد العنوان...";

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
                const data = await response.json();
                if (data && data.display_name) {
                    currentAddress = data.display_name;
                    // Try to get a short name for the Telegram Venue title
                    currentPlaceName = data.address.road || data.address.suburb || data.address.city || data.address.town || data.address.village || "موقع المستخدم";
                    addressVal.textContent = currentAddress;
                } else {
                    currentAddress = "لم يتم العثور على اسم للمكان";
                    addressVal.textContent = currentAddress;
                }
            } catch (error) {
                console.error("Geocoding error", error);
                currentAddress = "خطأ في الاتصال بخادم الخرائط";
                addressVal.textContent = currentAddress;
            }
        }

        function updateUI(position) {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            currentAcc = position.coords.accuracy;

            document.getElementById('lat-val').textContent = `Lat: ${currentLat.toFixed(5)}`;
            document.getElementById('lng-val').textContent = `Lng: ${currentLng.toFixed(5)}`;
            document.getElementById('acc-val').textContent = `Acc: ±${Math.round(currentAcc)}m`;

            telegramBtn.disabled = false; // Enable sending to telegram
            errorBox.classList.add('hidden'); // Hide errors

            if (!marker) {
                marker = L.marker([currentLat, currentLng]).addTo(map);
            } else {
                marker.setLatLng([currentLat, currentLng]);
            }
            map.setView([currentLat, currentLng], 16);

            // Fetch the address name in the background
            fetchAddress(currentLat, currentLng);
        }

        function handleError(error) {
            let msg = "An unknown error occurred.";
            if(error.code === error.PERMISSION_DENIED) {
                msg = "User denied the request for Geolocation. Please check your privacy settings or open in Google Chrome/Safari.";
            } else if (error.code === error.POSITION_UNAVAILABLE) {
                msg = "Location information is unavailable. Ensure GPS is turned on.";
            } else if (error.code === error.TIMEOUT) {
                msg = "The request to get user location timed out.";
            }
            
            errorMsg.textContent = msg;
            errorBox.classList.remove('hidden');
            stopTracking();
        }

        function startTracking() {
            if (!navigator.geolocation) {
                errorMsg.textContent = "Geolocation is not supported by this browser.";
                errorBox.classList.remove('hidden');
                return;
            }

            statusBadge.innerHTML = '<div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div><span class="text-blue-600">Active</span>';
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            stopBtn.classList.add('flex');
            errorBox.classList.add('hidden');

            watchId = navigator.geolocation.watchPosition(updateUI, handleError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        }

        function stopTracking() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            
            statusBadge.innerHTML = '<div class="w-2 h-2 rounded-full bg-gray-400"></div><span class="text-gray-500">Idle</span>';
            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            stopBtn.classList.remove('flex');
            telegramBtn.disabled = true;
        }

        async function sendToTelegram() {
            if (!currentLat || !currentLng) return;
            
            const originalText = telegramBtn.innerHTML;
            telegramBtn.disabled = true;
            telegramBtn.innerHTML = 'Sending...';

            // We use 'sendVenue' instead of 'sendLocation' so we can include the address name
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendVenue`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        latitude: currentLat,
                        longitude: currentLng,
                        title: currentPlaceName.substring(0, 30), // Telegram API limits title length
                        address: currentAddress
                    })
                });

                if (response.ok) {
                    telegramBtn.innerHTML = '✅ Sent Successfully!';
                    setTimeout(() => { telegramBtn.innerHTML = originalText; telegramBtn.disabled = false; }, 3000);
                } else {
                    throw new Error('Telegram API Error');
                }
            } catch (error) {
                alert('Error: Could not send to Telegram. Please check your internet connection.');
                telegramBtn.innerHTML = originalText;
                telegramBtn.disabled = false;
            }
        }

        initMap();
        startBtn.addEventListener('click', startTracking);
        stopBtn.addEventListener('click', stopTracking);
        telegramBtn.addEventListener('click', sendToTelegram);
    </script>
</body>
</html>
